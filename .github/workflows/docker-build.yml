name: Docker Build

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      platforms:
        required: false
        type: string
        default: "linux/amd64"
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-${{ inputs.component }}

jobs:
  run_tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: run_tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          tags: local/${{ env.IMAGE_NAME }}:${{ matrix.arch }}
          outputs: type=docker,dest=/tmp/image-${{ matrix.arch }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: /tmp/image-${{ matrix.arch }}.tar

  merge:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.1.1'

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: /tmp/images

      - name: Push multi-arch manifest
        run: |
          set -euo pipefail

          for d in /tmp/images/*/; do
            arch=$(basename "$d" | sed 's/^image-//')
            docker load < "${d}image-${arch}.tar"
          done

          TAGS='${{ steps.meta.outputs.tags }}'
          for tag in $TAGS; do
            arch_tags=""
            for arch in amd64 arm64; do
              local_ref="local/${{ env.IMAGE_NAME }}:${arch}"
              if docker image inspect "$local_ref" >/dev/null 2>&1; then
                tagged="${tag}-${arch}"
                docker tag "$local_ref" "$tagged"
                docker push "$tagged"
                arch_tags="${arch_tags} ${tagged}"
              fi
            done
            if [ -n "$arch_tags" ]; then
              docker buildx imagetools create $arch_tags -t "$tag"
            fi
          done
